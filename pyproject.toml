[project]
name = "file-timestamp-formatter"
version = "0.1.0"
description = "Turns os.stat_result timestamps into ISO 8601 strings with a fixed UTC offset, stdlib only."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
